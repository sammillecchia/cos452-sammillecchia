<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Week 3 Starter -- Hello Triangle</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>

  <body>
    <canvas id="gl-canvas"></canvas>
    <script>
      const canvas = document.getElementById("gl-canvas");
      const gl = canvas.getContext("webgl2");
      if (!gl) {
        throw new Error("WebGL2 is not available on this device/browser.");
      }

      const vertexSource = `#version 300 es
      in vec2 a_position;
      void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
      }`;

      const fragmentSource = `#version 300 es
      precision mediump float;
      out vec4 outColor;
      void main() {
        outColor = vec4(0.9, 0.5, 0.1, 1.0);  // TODO(student): recolor me
      }`;

      function createShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const log = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error("Shader failed to compile: " + log);
        }
        return shader;
      }

      function createProgram(gl, vsSource, fsSource) {
        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(
          program,
          createShader(gl, gl.FRAGMENT_SHADER, fsSource),
        );
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(
            "Program failed to link: " + gl.getProgramInfoLog(program),
          );
        }
        return program;
      }

      let positions = new Float32Array([
        -0.5,
        -0.5, //bottom left
        0.5,
        -0.5, //bottom right              //first tri
        -0.5,
        0.5, //top left
        -0.5,
        0.5, //top left
        0.5,
        -0.5, //bottom right              //second tri
        0.5,
        0.5, //top right
      ]);

      const program = createProgram(gl, vertexSource, fragmentSource);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

      const aPosition = gl.getAttribLocation(program, "a_position");
      gl.enableVertexAttribArray(aPosition);
      gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

      function calculatePositionsFromDimensions(width, height) {
        const ratio = width / height;
        //console.log(ratio);

        //scaling width and height of the square based off of dimensions of canvas
        let x1, x2, y1, y2;
        if (ratio > 1) {
          x1 = -0.5 / ratio;
          x2 = 0.5 / ratio;
          y1 = -0.5;
          y2 = 0.5;
        } else {
          x1 = -0.5;
          x2 = 0.5;
          y1 = -0.5 * ratio;
          y2 = 0.5 * ratio;
        }

        fillPositionArray(x1, x2, y1, y2);
      }

      //referenced https://webgl2fundamentals.org/webgl/lessons/webgl-fundamentals.html for drawing rectangles
      function fillPositionArray(x1, x2, y1, y2) {
        positions = new Float32Array([
          x1,
          y1,
          x2,
          y1,
          x1,
          y2,
          x1,
          y2,
          x2,
          y1,
          x2,
          y2,
        ]);

        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        //console.log(positions)
      }

      //(-x = left, +x = right), (-y = bottom, +y = top)

      function render() {
        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        calculatePositionsFromDimensions(w, h);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        gl.viewport(0, 0, canvas.width, canvas.height);

        gl.useProgram(program);
        gl.clearColor(0.1, 0.12, 0.16, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
      }

      window.addEventListener("resize", render);
      render();
    </script>
  </body>
</html>
