<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Week 5 Starter -- Multiple Triangles & VBOs</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="gl-canvas"></canvas>
  <script>
    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    const vertexSource = `#version 300 es
      in vec2 a_position;
      in vec2 a_uv;
      out vec2 v_uv;
      void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
        v_uv = a_uv;
      }`;

    const fragmentSource = `#version 300 es
      precision mediump float;
      in vec2 v_uv;
      uniform sampler2D u_texture;
      out vec4 outColor;
      void main() { outColor = texture(u_texture, v_uv); }`;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error("Shader failed to compile: " + log);
      }
      return shader;
    }

    function createProgram(gl, vsSource, fsSource) {
      const program = gl.createProgram();
      gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
      gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error("Program failed to link: " + gl.getProgramInfoLog(program));
      }
      return program;
    }

    const program = createProgram(gl, vertexSource, fragmentSource);

    // Interleaved: x, y, r, g, b per vertex. TODO(student): add a 3rd triangle.

    // I believe that the reason why the colors look different on either side of
    // the seam between the two triangles is because when the colors are averaged
    // in the fragment shader they are interpolations of the colors of the vertices 
    // they lie within meaning that colors in one triangle cant "bleed" into other 
    // triangles. However since my Bottom Left and Top Right colors are the same
    // the diagonal line through those points has the same/very similar colors 
    // in both triangles.
    const data = new Float32Array([
      // Sky
      -1.0,  1.0,   0.0, 1.0,  // Top Left
      -1.0, -0.6,   0.0, 0.0,  // Bottom Left
      1.0, -0.6,   1.0, 0.0,  // Bottom Right
      1.0,  1.0,   1.0, 1.0,  // Top Right

      // House (Walls/Roof)
      -0.6, -0.6,   0.0, 0.0,  // Bottom Left
      0.6, -0.6,   2.0, 0.0,  // Bottom Right
      0.6,  0.6,   2.0, 0.8,  // Top Right 
      -0.6,  0.6,   0.0, 0.8,  // Top Left  
      0.0,  0.9,   0.5, 2.0,  // Roof Top 

      // Door
      0.1, -0.6,   1.0, 0.0,  // Bottom Right
      -0.1, -0.6,   0.0, 0.0,  // Bottom Left
      0.1, -0.1,   1.0, 1.0,  // Top Right
      -0.1, -0.1,   0.0, 1.0,  // Top Left

      // Window 1
      -0.5,  0.0,   0.0, 0.0,  // Bottom Left
      -0.3,  0.0,   1.0, 0.0,  // Bottom Right
      -0.5,  0.3,   0.0, 1.0,  // Top Left
      -0.3,  0.3,   1.0, 1.0,  // Top Right

      // Window 2
      0.5,  0.0,   1.0, 0.0,  // Bottom Right
      0.3,  0.0,   0.0, 0.0,  // Bottom Left
      0.5,  0.3,   1.0, 1.0,  // Top Right
      0.3,  0.3,   0.0, 1.0,  // Top Left

      // Ground
      -1.0, -1.0,   0.0, 0.0,  // Bottom Left
      1.0, -1.0,   2.0, 0.0,  // Bottom Right
      -1.0, -0.6,   0.0, 2.0,  // Top Left
      1.0, -0.6,   2.0, 2.0,  // Top Right
    ]);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);

    const indices = new Uint16Array([
      0, 1, 2, 0, 2, 3,  //sky
      4, 5, 6, 4, 6, 7,  // walls
      6, 7, 8,           // roof
      9, 10, 12, 9, 11, 12,   // door
      13, 14, 16, 13, 15, 16,   // window 1
      17, 18, 20, 17, 19, 20,   // window 2
      21, 22, 24, 21, 23, 24
    ]);         



    const indexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

    const F = Float32Array.BYTES_PER_ELEMENT; // 4
    const stride = 4 * F;                     // 20

    const aPosition = gl.getAttribLocation(program, "a_position");
    gl.enableVertexAttribArray(aPosition);
    gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, stride, 0);

    const aColor = gl.getAttribLocation(program, "a_uv");
    gl.enableVertexAttribArray(aColor);
    gl.vertexAttribPointer(aColor, 2, gl.FLOAT, false, stride, 2 * F);

    const VERTEX_COUNT = indices.length;

    function loadTexture(gl, url) {
      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      
      const pixel = new Uint8Array([0, 0, 255, 255]);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      
      const image = new Image();
      image.crossOrigin = "anonymous";
      image.src = url;
      image.addEventListener('load', function() {
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
         gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        render(); 
      });
      
      return texture;
    }

    const skyTexture = loadTexture(gl, "textures/Sky.jpg");
    const wallTexture = loadTexture(gl, "textures/Brick.jpg");
    const roofTexture  = loadTexture(gl, "textures/Roof.jpg");
    const doorTexture = loadTexture(gl, "textures/Door.jpg");
    const windowTexture = loadTexture(gl, "textures/Window.jpg");
    const groundTexture = loadTexture(gl, "textures/Grass.jpg");
    

    // const indices = new Uint16Array([
    //   0, 1, 2, 0, 2, 3,  //sky
    //   4, 5, 6, 4, 6, 7,  // walls
    //   6, 7, 8,           // roof
    //   9, 10, 12, 9, 11, 12,   // door
    //   13, 14, 16, 13, 15, 16,   // window 1
    //   17, 18, 20, 17, 19, 20,   // window 2
    //   21, 22, 24, 21, 23, 24
    // ]);       
    function render() {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(canvas.clientWidth * dpr);
      const h = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);

      gl.useProgram(program);
      gl.clearColor(0.10, 0.10, 0.10, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);

      //Sky
      gl.bindTexture(gl.TEXTURE_2D, skyTexture);
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0 * 2); 

      //Walls
      gl.bindTexture(gl.TEXTURE_2D, wallTexture);
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 6 * 2); 

      //Roof
      gl.bindTexture(gl.TEXTURE_2D, roofTexture);
      gl.drawElements(gl.TRIANGLES, 3, gl.UNSIGNED_SHORT, 12 * 2);

      //Door
      gl.bindTexture(gl.TEXTURE_2D, doorTexture);
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 15 * 2); 

      //Windows
      gl.bindTexture(gl.TEXTURE_2D, windowTexture); 
      gl.drawElements(gl.TRIANGLES, 12, gl.UNSIGNED_SHORT, 21 * 2);

      //Ground
      gl.bindTexture(gl.TEXTURE_2D, groundTexture); 
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 33 * 2); 
    }

    window.addEventListener("resize", render);
    render();
  </script>
</body>

</html>
