<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Week 1 Starter -- Canvas &amp; Clear Color</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <script>
    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");

    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    function resizeCanvasToDisplaySize() {
      const dpr = window.devicePixelRatio || 1;
      const width = Math.round(canvas.clientWidth * dpr);
      const height = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    function render() {
        resizeCanvasToDisplaySize();
        gl.viewport(0, 0, canvas.width, canvas.height);

        // TODO(student): try changing these values
        c = colors[currentColorIndex]; //shorthand variable for current color object
        gl.clearColor(c.r, c.g, c.b, c.a);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }

    let start = performance.now(); 

    const colors = {
        1: { r: 1.0, g: 0.0, b: 0.0, a: 1.0 }, //Red
        2: { r: 0.1, g: 1.0, b: 0.0, a: 1.0 }, //Green
        3: { r: 0.0, g: 0.0, b: 1.0, a: 1.0 }, //Blue
      };

      let currentColorIndex = 1; //number representing the default/initial color
      let nextColorIndex =
        currentColorIndex < Object.keys(colors).length
          ? currentColorIndex + 1
          : 1; //number representing the index of the next color in the chain of
      let currentColor = { r: 0.0, g: 0.0, b: 0.0, a: 0.0 }; //object representing the currentColor


    function update(timestamp) {
        const dt = timestamp - start;
        render();

        if (dt > 1000) {
          if (currentColorIndex < Object.keys(colors).length) {
            //If not at final color in object, loop to the next color object
            currentColorIndex++;
          } else {
            //Else, return to the first color object
            currentColorIndex = 1;
          }
          nextColorIndex =
            currentColorIndex < Object.keys(colors).length
              ? currentColorIndex + 1
              : 1;
          start = timestamp;
        }

        requestAnimationFrame(update);
      }


    window.addEventListener("resize", render);
    render();
    update();
  </script>
</body>
</html>
