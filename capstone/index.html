<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Marble - Capstone</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="gl-canvas"></canvas>
  <script type="module">
    import { Camera } from './camera.js'
    import { calculatedFaces, calculatedIndices } from './icosphere.js';
    import { lookAt, inverse, perspective, translation, multiply, identity, axisRotation } from './math.js';
    import { Platform, levelPlatforms, wedgeVertices, wedgeIndices, cubeVertices, cubeIndices } from './platform.js';
    import { player, updatePhysics } from './physics.js';

    let renderDistance = 1000;

    //TODO: Refactor these into playerInputs
    let dragging = false, lastX = 0, lastY = 0;

    let playerInputs = {
      camera: {
        mouseX: 0,
        mouseY: 0,
        keyPosX: 0,
        keyNegX: 0,
        keyPosY: 0,
        keyNegY: 0
      },
      movement: {
        keyForward: 0,
        keyBack: 0,
        keyLeft: 0,
        keyRight: 0,
        keyJump: 0
      }
    }

    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    const vertexSource = `#version 300 es
    in vec3 a_position;
    in vec2 a_uv;
    uniform mat4 u_mvp;
    out vec2 v_uv;

    void main() {
        gl_Position = u_mvp * vec4(a_position, 1.0);
        v_uv = a_uv; 
    }`;

    const fragmentSource = `#version 300 es
    precision mediump float;
    in vec2 v_uv;
    out vec4 outColor;
    uniform sampler2D u_texture;

    void main() { 
        outColor = texture(u_texture, v_uv); 
    }`;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error("Shader failed to compile: " + gl.getShaderInfoLog(shader));
      }
      return shader;
    }
    function createProgram(gl, vsSource, fsSource) {
      const program = gl.createProgram();
      gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
      gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error("Program failed to link: " + gl.getProgramInfoLog(program));
      }
      return program;
    }

    // Helper to create and bind buffers
    function createBuffer(data, bufferType) {
      const buffer = gl.createBuffer();
      gl.bindBuffer(bufferType, buffer);
      gl.bufferData(bufferType, data, gl.STATIC_DRAW);
      return buffer;
    }

    // Helper to create VAOs 
    function createVAO(vertexBuffer, uvBuffer, indexBuffer) {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);

      gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
      gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(aPosition);

      gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer);
      gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(aUV);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);

      gl.bindVertexArray(null); 
      return vao;
    }

    const program = createProgram(gl, vertexSource, fragmentSource);

    const aPosition = gl.getAttribLocation(program, "a_position");
    const aUV = gl.getAttribLocation(program, "a_uv");
    const uMVP = gl.getUniformLocation(program, "u_mvp");
    gl.enableVertexAttribArray(aUV);
    gl.enableVertexAttribArray(aPosition);

    // Creating a simple checkerboard texture for testing
    const checkerboardTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, checkerboardTexture);

    const checkerboard = new Uint8Array([
      200, 200, 200, 255, 100, 100, 100, 255,
      100, 100, 100, 255, 200, 200, 200, 255
    ]);

    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, checkerboard);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);

    
    //Setup buffers for marble
    const marbleIndiceBuffer = createBuffer(calculatedIndices, gl.ARRAY_BUFFER);
    const marbleFaceBuffer = createBuffer(calculatedFaces, gl.ELEMENT_ARRAY_BUFFER);

    //Setup buffers for cubes
    const cubeVerticeBuffer = createBuffer(cubeVertices, gl.ARRAY_BUFFER);
    const cubeIndiceBuffer = createBuffer(cubeIndices, gl.ELEMENT_ARRAY_BUFFER);

    //Setup buffers for wedges
    const wedgeVerticeBuffer = createBuffer(wedgeVertices, gl.ARRAY_BUFFER);
    const wedgeIndiceBuffer = createBuffer(wedgeIndices, gl.ELEMENT_ARRAY_BUFFER);

    // Setup platform UV buffers
    for (const platform of levelPlatforms) {
      platform.uvBuffer = createBuffer(platform.uvs, gl.ARRAY_BUFFER);
    }

    // https://webgl2fundamentals.org/webgl/lessons/webgl-attributes.html

    // Setup VAOs for platforms
    for (const platform of levelPlatforms) {
      const vertexBuffer = platform.shape === "cube" ? cubeVerticeBuffer : wedgeVerticeBuffer;
      const indiceBuffer = platform.shape === "cube" ? cubeIndiceBuffer : wedgeIndiceBuffer;
      
      platform.vao = createVAO(vertexBuffer, platform.uvBuffer, indiceBuffer);
    }

    // Setup VAO for marble
    const marbleVAO = createVAO(marbleIndiceBuffer, marbleIndiceBuffer, marbleFaceBuffer);

    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);

    const aspect = canvas.width / canvas.height;
    let P = perspective(93 * Math.PI / 180, aspect, 0.1, renderDistance);
    let V = translation(0, 0, -3);
    let VP = multiply(P, V);

    // TODO: Add camera movement controlled with arrow keys
    window.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });

    window.addEventListener("contextmenu", (e) => {
      e.preventDefault();
    });

    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      playerInputs.camera.mouseX += e.clientX - lastX;
      playerInputs.camera.mouseY -= e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener("pointerup", () => { dragging = false; });

    // Event listeners for movement
    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (["w", "a", "s", "d"].includes(key)) {
        e.preventDefault();
      }
      if (key === "w") playerInputs.movement.keyForward = 1;
      if (key === "s") playerInputs.movement.keyBack = 1;
      if (key === "a") playerInputs.movement.keyLeft = 1;
      if (key === "d") playerInputs.movement.keyRight = 1;
      if (key === " ") playerInputs.movement.keyJump = 1;
    });

    window.addEventListener("keyup", (e) => {
      const key = e.key.toLowerCase();
      if (key === "w") playerInputs.movement.keyForward = 0;
      if (key === "s") playerInputs.movement.keyBack = 0;
      if (key === "a") playerInputs.movement.keyLeft = 0;
      if (key === "d") playerInputs.movement.keyRight = 0;
      if (key === " ") playerInputs.movement.keyJump = 0;
    });

    // Fixes movement keys becoming stuck when tabbing out
    window.addEventListener("blur", () => {
      playerInputs.movement.keyForward = 0;
      playerInputs.movement.keyBack = 0;
      playerInputs.movement.keyLeft = 0;
      playerInputs.movement.keyRight = 0;
      playerInputs.movement.keyJump = 0;
      dragging = false;
    });

    const mainCamera = new Camera(15);

    const dRotation = new Float32Array(16);
    let marbleRotation = identity();

    let last = 0;
    function frame(t) {
      // Calculate delta time
      let dt = last ? (t - last) / 1000 : 0.016;
      last = t;

      // Bounding dt to at most 0.1 to prevent lag spikes and tabbing out having unitended
      // behaviour on gameplay. Some examples of this are: Having incredibly high gravity 
      // applied, having incredibly high acceleration applied, friction not stopping, just
      // clipping through the floor into the endless void, you get the idea.
      if (dt > 0.1) dt = 0.1;

      // Do physics
      updatePhysics(dt, mainCamera, playerInputs, levelPlatforms);

      // Update the camera with updated positions
      mainCamera.update(player.position, playerInputs);

      // Resizing logic
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(canvas.clientWidth * dpr);
      const h = Math.round(canvas.clientHeight * dpr);

      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        const newAspect = canvas.width / canvas.height;
        P = perspective(50 * Math.PI / 180, newAspect, 0.1, renderDistance);
      }

      gl.viewport(0, 0, canvas.width, canvas.height);

      // Setup for drawing
      VP = multiply(P, mainCamera.viewMatrix);

      gl.clearColor(0.10, 0.10, 0.10, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(program);

      // Bind platform VAOs
      for (const platform of levelPlatforms) {
        gl.bindVertexArray(platform.vao);

        const platformMVP = multiply(VP, platform.getMatrix());
        gl.uniformMatrix4fv(uMVP, false, platformMVP);
        
        const indexCount = platform.shape === "cube" ? 36 : 24;
        gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);
      }

      // Bind marble VAO
      gl.bindVertexArray(marbleVAO);

      // Calculate distance moved
      const dx = player.position[0] - player.lastPosition[0];
      const dz = player.position[2] - player.lastPosition[2];
      const distance = Math.hypot(dx, dz);

      // Calculate axis-angle rotation
      if (distance > 0.0001) {
        const axis = [dz, 0, -dx]; 
        const angle = distance / player.radius; 
        axisRotation(angle, axis, dRotation);
        marbleRotation = multiply(dRotation, marbleRotation);
      }
      

      player.lastPosition = [...player.position];

      //
      const T = translation(player.position[0], player.position[1], player.position[2]);
      const M = multiply(T, marbleRotation); 
      
      const mvp = multiply(VP, M);
      gl.uniformMatrix4fv(uMVP, false, mvp);
      gl.drawElements(gl.TRIANGLES, calculatedFaces.length, gl.UNSIGNED_SHORT, 0);

      gl.bindVertexArray(null);

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>

</html>
