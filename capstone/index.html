<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Week 8 Starter -- Cube & Depth Testing</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="gl-canvas"></canvas>
  <script type="module">
    import { calculatedFaces, calculatedIndices } from './icosphere.js';
    import { lookAt, inverse, perspective, translation, multiply } from './math.js';
    import { Platform, levelPlatforms, wedgeVertices, wedgeIndices, cubeVertices, cubeIndices } from './platform.js';


    //player position in cartesian coordinates
    let playerPosition = [0, 0, 0];

    let playerInputs = {
      camera: {
        mouseX: 0,
        mouseY: 0,
        keyPosX: 0,
        keyNegX: 0,
        keyPosY: 0,
        keyNegY: 0
      },
      movement: {
        keyForward: 0,
        keyBack: 0,
        keyLeft: 0,
        keyRight: 0,
        keyJump: 0
      }
    }

    // A class for handling moving the viewport and handling collision
    class Camera {

      constructor(distance) {
        this.distance = distance;
        this.azimuth = 0; //X rotation
        this.elevation = 0;   //Y rotation
        this.up = [0, 1, 0];
        this.cameraMatrix = new Float32Array(16)
        this.viewMatrix = new Float32Array(16);
      }

      // updates camara view position, takes a calculated target position and
      // the playerInputs.camera object 
      // heavily referenced webgl2 fundamentals for creating the camera system
      // https://webgl2fundamentals.org/webgl/lessons/webgl-visualizing-the-camera.html
      update(targetPosition, inputs) {
        // TODO: ADD Camera Keyboard Controls

        // Starting with just 0.01 but may want to have variable sensitivty
        this.azimuth -= inputs.camera.mouseX * 0.01;
        this.elevation -= inputs.camera.mouseY * 0.005;

        // Reset camera 
        inputs.camera.mouseX = 0;
        inputs.camera.mouseY = 0;

        // Set a offset for the camera so the marble is rendered lower down
        const yOffset = 1.5;
        const positionOffset = [
          targetPosition[0],
          targetPosition[1] + yOffset,
          targetPosition[2]
        ];

        // Clamping so camera cant move over the top of the marble
        const maxPitch = 1.56; // Slightly less than 90 degrees
        this.elevation = Math.max(-maxPitch, Math.min(maxPitch, this.elevation));

        const cosElevation = Math.cos(this.elevation);
        const eye = [
          positionOffset[0] + this.distance * cosElevation * Math.sin(this.azimuth),
          positionOffset[1] + this.distance * Math.sin(this.elevation),
          positionOffset[2] + this.distance * cosElevation * Math.cos(this.azimuth)
        ];

        const cameraMatrix = lookAt(eye, positionOffset, this.up);
        this.viewMatrix = inverse(cameraMatrix, cameraMatrix);
      }
    }


    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }


    const vertexSource = `#version 300 es
    in vec3 a_position;
    uniform mat4 u_mvp;
    out vec3 v_color; 
    void main() {
        gl_Position = u_mvp * vec4(a_position, 1.0);
        // Convert -1 to 1 range into 0 to 1 range for colors
        v_color = a_position * 0.5 + 0.5; 
    }`;

    const fragmentSource = `#version 300 es
    precision mediump float;
    in vec3 v_color;
    out vec4 outColor;
    void main() { 
        outColor = vec4(v_color, 1.0);  
    }`;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error("Shader failed to compile: " + gl.getShaderInfoLog(shader));
      }
      return shader;
    }
    function createProgram(gl, vsSource, fsSource) {
      const program = gl.createProgram();
      gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
      gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error("Program failed to link: " + gl.getProgramInfoLog(program));
      }
      return program;
    }


    const program = createProgram(gl, vertexSource, fragmentSource);

    const marbleIndiceBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, marbleIndiceBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, calculatedIndices, gl.STATIC_DRAW);

    const marbleFaceBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, marbleFaceBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, calculatedFaces, gl.STATIC_DRAW);

    const aPosition = gl.getAttribLocation(program, "a_position");
    gl.enableVertexAttribArray(aPosition);
    gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
    const uMVP = gl.getUniformLocation(program, "u_mvp");


    const wedgeVerticeBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, wedgeVerticeBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, wedgeVertices, gl.STATIC_DRAW);

    const wedgeIndiceBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, wedgeIndiceBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, wedgeIndices, gl.STATIC_DRAW);

    const cubeVerticeBuffer = gl.createBuffer();

    gl.bindBuffer(gl.ARRAY_BUFFER, cubeVerticeBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, cubeVertices, gl.STATIC_DRAW);

    const cubeIndiceBuffer = gl.createBuffer();

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, cubeIndiceBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, cubeIndices, gl.STATIC_DRAW);

    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);

    const aspect = canvas.width / canvas.height;
    let P = perspective(93 * Math.PI / 180, aspect, 0.1, 100);
    let V = translation(0, 0, -3);
    let VP = multiply(P, V);

    let angleX = 0.4, angleY = 0.6;
    const keys = {};
    let dragging = false, lastX = 0, lastY = 0;
    let autoSpin = true;

    //TODO: Add camera movement controlled with arrow keys
    canvas.addEventListener("keydown", (e) => {
      if (e.key === " ") { autoSpin = !autoSpin; e.preventDefault(); return; }
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
        keys[e.key] = true; e.preventDefault();
      }
    });
    canvas.addEventListener("keyup", (e) => { keys[e.key] = false; });

    canvas.addEventListener("pointerdown", (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      playerInputs.camera.mouseX += e.clientX - lastX;
      playerInputs.camera.mouseY -= e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    canvas.addEventListener("pointerup", () => { dragging = false; });


    const mainCamera = new Camera(15);

    let last = 0;
    function frame(t) {
      last = t;

      mainCamera.update(playerPosition, playerInputs);

      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(canvas.clientWidth * dpr);
      const h = Math.round(canvas.clientHeight * dpr);

      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        const newAspect = canvas.width / canvas.height;
        P = perspective(50 * Math.PI / 180, newAspect, 0.1, 100);
      }

      gl.viewport(0, 0, canvas.width, canvas.height);

      VP = multiply(P, mainCamera.viewMatrix);

      gl.clearColor(0.10, 0.10, 0.10, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(program);

      // Draw Platforms (wedges and cubes)
      for (const platform of levelPlatforms) {
        if (platform.shape === "cube") {
          gl.bindBuffer(gl.ARRAY_BUFFER, cubeVerticeBuffer);
          gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, cubeIndiceBuffer);
        } else if (platform.shape === "wedge") {
          gl.bindBuffer(gl.ARRAY_BUFFER, wedgeVerticeBuffer);
          gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, wedgeIndiceBuffer);
        }

        const platformMVP = multiply(VP, platform.getMatrix());
        gl.uniformMatrix4fv(uMVP, false, platformMVP);

        const indexCount = platform.shape === "cube" ? 36 : 24;
        gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);
      }

      // Draw the marble
      gl.bindBuffer(gl.ARRAY_BUFFER, marbleIndiceBuffer);
      gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, marbleFaceBuffer);

      const M = translation(playerPosition[0], playerPosition[1], playerPosition[2]);
      const mvp = multiply(VP, M);

      gl.uniformMatrix4fv(uMVP, false, mvp);
      gl.drawElements(gl.TRIANGLES, calculatedFaces.length, gl.UNSIGNED_SHORT, 0);

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>

</html>
