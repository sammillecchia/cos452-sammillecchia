<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Marble - Capstone</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="gl-canvas"></canvas>
  <script type="module">
    import { calculatedFaces, calculatedIndices } from './icosphere.js';
    import { lookAt, inverse, perspective, translation, multiply } from './math.js';
    import { Platform, levelPlatforms, wedgeVertices, wedgeIndices, cubeVertices, cubeIndices } from './platform.js';


    //Player data
    let playerPosition = [0, 5, 0];
    let playerVelocity = [0, 0, 0];
    const marbleRadius = 1.0;

    //TODO: Refactor these into playerInputs
    let dragging = false, lastX = 0, lastY = 0;

    let playerInputs = {
      camera: {
        mouseX: 0,
        mouseY: 0,
        keyPosX: 0,
        keyNegX: 0,
        keyPosY: 0,
        keyNegY: 0
      },
      movement: {
        keyForward: 0,
        keyBack: 0,
        keyLeft: 0,
        keyRight: 0,
        keyJump: 0
      }
    }

    // A class for handling moving the viewport
    class Camera {
      constructor(distance) {
        this.distance = distance;
        this.baseDistance = distance;
        this.azimuth = 0;          //X rotation
        this.elevation = 0;        //Y rotation
        this.up = [0, 1, 0];
        this.cameraMatrix = new Float32Array(16)
        this.viewMatrix = new Float32Array(16);
      }

      // Updates camara view position, takes a calculated target position and
      // the playerInputs.camera object 
      // Heavily references webgl2 fundamentals for creating the camera system
      // https://webgl2fundamentals.org/webgl/lessons/webgl-visualizing-the-camera.html
      update(targetPosition, inputs) {

        // TODO: Add collision detection so the camera doesnt clip through the floor (clamping/checking distance)

        // Starting with just 0.01 but may want to change this to allow for variable sensitivty
        this.azimuth -= inputs.camera.mouseX * 0.01;
        this.elevation -= inputs.camera.mouseY * 0.005;

        // Reset camera 
        inputs.camera.mouseX = 0;
        inputs.camera.mouseY = 0;

        // Set a offset for the camera so the marble is rendered lower down
        const yOffset = 1.5;
        const positionOffset = [
          targetPosition[0],
          targetPosition[1] + yOffset,
          targetPosition[2]
        ];

        // Clamping so camera cant move over the top of the marble
        const maxPitch = 1.56; // Slightly less than 90 degrees
        this.elevation = Math.max(-maxPitch, Math.min(maxPitch, this.elevation));

        const cosElevation = Math.cos(this.elevation);
        const eye = [
          positionOffset[0] + this.distance * cosElevation * Math.sin(this.azimuth),
          positionOffset[1] + this.distance * Math.sin(this.elevation),
          positionOffset[2] + this.distance * cosElevation * Math.cos(this.azimuth)
        ];

        const cameraMatrix = lookAt(eye, positionOffset, this.up);
        this.viewMatrix = inverse(cameraMatrix, cameraMatrix);
      }
    }

    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    const vertexSource = `#version 300 es
    in vec3 a_position;
    uniform mat4 u_mvp;
    out vec3 v_color; 
    void main() {
        gl_Position = u_mvp * vec4(a_position, 1.0);
        // Convert -1 to 1 range into 0 to 1 range for colors
        v_color = a_position * 0.5 + 0.5; 
    }`;

    const fragmentSource = `#version 300 es
    precision mediump float;
    in vec3 v_color;
    out vec4 outColor;
    void main() { 
        outColor = vec4(v_color, 1.0);  
    }`;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error("Shader failed to compile: " + gl.getShaderInfoLog(shader));
      }
      return shader;
    }
    function createProgram(gl, vsSource, fsSource) {
      const program = gl.createProgram();
      gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
      gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error("Program failed to link: " + gl.getProgramInfoLog(program));
      }
      return program;
    }


    const program = createProgram(gl, vertexSource, fragmentSource);

    //Setup buffers for marble
    const marbleIndiceBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, marbleIndiceBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, calculatedIndices, gl.STATIC_DRAW);

    const marbleFaceBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, marbleFaceBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, calculatedFaces, gl.STATIC_DRAW);

    const aPosition = gl.getAttribLocation(program, "a_position");
    gl.enableVertexAttribArray(aPosition);
    gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
    const uMVP = gl.getUniformLocation(program, "u_mvp");

    //Setup buffers for cubes
    const cubeVerticeBuffer = gl.createBuffer();

    gl.bindBuffer(gl.ARRAY_BUFFER, cubeVerticeBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, cubeVertices, gl.STATIC_DRAW);

    const cubeIndiceBuffer = gl.createBuffer();

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, cubeIndiceBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, cubeIndices, gl.STATIC_DRAW);

    //Setup buffers for wedges
    const wedgeVerticeBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, wedgeVerticeBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, wedgeVertices, gl.STATIC_DRAW);

    const wedgeIndiceBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, wedgeIndiceBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, wedgeIndices, gl.STATIC_DRAW);


    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);

    
    const aspect = canvas.width / canvas.height;
    let P = perspective(93 * Math.PI / 180, aspect, 0.1, 100);
    let V = translation(0, 0, -3);
    let VP = multiply(P, V);


    // TODO: Add camera movement controlled with arrow keys
    window.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });

    window.addEventListener("contextmenu", (e) => {
      e.preventDefault();
    });

    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      playerInputs.camera.mouseX += e.clientX - lastX;
      playerInputs.camera.mouseY -= e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener("pointerup", () => { dragging = false; });

    //Event listeners for movement
    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (["w", "a", "s", "d"].includes(key)) {
        e.preventDefault();
      }
      if (key === "w") playerInputs.movement.keyForward = 1;
      if (key === "s") playerInputs.movement.keyBack = 1;
      if (key === "a") playerInputs.movement.keyLeft = 1;
      if (key === "d") playerInputs.movement.keyRight = 1;
      if (key === " ") playerInputs.movement.keyJump = 1;
    });

    window.addEventListener("keyup", (e) => {
      const key = e.key.toLowerCase();
      if (key === "w") playerInputs.movement.keyForward = 0;
      if (key === "s") playerInputs.movement.keyBack = 0;
      if (key === "a") playerInputs.movement.keyLeft = 0;
      if (key === "d") playerInputs.movement.keyRight = 0;
      if (key === " ") playerInputs.movement.keyJump = 0;
    });

    // Fixes movement keys becoming stuck when tabbing out
    window.addEventListener("blur", () => {
      playerInputs.movement.keyForward = 0;
      playerInputs.movement.keyBack = 0;
      playerInputs.movement.keyLeft = 0;
      playerInputs.movement.keyRight = 0;
      playerInputs.movement.keyJump = 0;
      dragging = false; 
    });

    const mainCamera = new Camera(15);

    
    let last = 0;
    function frame(t) {
      // Calculate delta time
      const dt = last ? (t - last) / 1000 : 0.016; 
      last = t;
      let isGrounded = false;

      // Gravity
      const gravity = -45.0;
      playerVelocity[1] += gravity * dt;

      // WASD movement (relative to camera)
      const forwardX = -Math.sin(mainCamera.azimuth);
      const forwardZ = -Math.cos(mainCamera.azimuth);
      const rightX = Math.cos(mainCamera.azimuth);
      const rightZ = -Math.sin(mainCamera.azimuth);

      let moveX = 0;
      let moveZ = 0;

      if (playerInputs.movement.keyForward) { moveX += forwardX; moveZ += forwardZ; }
      if (playerInputs.movement.keyBack) { moveX -= forwardX; moveZ -= forwardZ; }
      if (playerInputs.movement.keyRight) { moveX += rightX; moveZ += rightZ; }
      if (playerInputs.movement.keyLeft) { moveX -= rightX; moveZ -= rightZ; }

      // Normalizing the direction, so diagonal movement isnt super fast
      const moveLength = Math.hypot(moveX, moveZ);
      if (moveLength > 0) {
        moveX /= moveLength;
        moveZ /= moveLength;

        //Makes diagonal movement not completely locked to 1
        if (moveLength > 1.0) {
          const diagonalBoost = 1.15; 
          moveX *= diagonalBoost;
          moveZ *= diagonalBoost;
        }
      }

      // Apply acceleration to velocity
      const acceleration = 30.0; 
      playerVelocity[0] += moveX * acceleration * dt;
      playerVelocity[2] += moveZ * acceleration * dt;

      // Friction
      const friction = 8.0; 
      if (isGrounded) {
        playerVelocity[0] -= playerVelocity[0] * friction * dt;
        playerVelocity[2] -= playerVelocity[2] * friction * dt;
      } else {
        playerVelocity[0] -= playerVelocity[0] * (friction * 0.2) * dt;
        playerVelocity[2] -= playerVelocity[2] * (friction * 0.2) * dt;
      }

      let nextX = playerPosition[0] + playerVelocity[0] * dt;
      let nextY = playerPosition[1] + playerVelocity[1] * dt;
      let nextZ = playerPosition[2] + playerVelocity[2] * dt;

      // Collision detection (currently only for the top of cube platforms)
      // TODO: add some sort of chunking system as right now the collision detection is done
      // for every single cube platform, which seems like it will become laggy with enough cubes
      for (const platform of levelPlatforms) {
        if (platform.shape === "cube") {

          const minX = platform.position[0] - (platform.scale[0] / 2);
          const maxX = platform.position[0] + (platform.scale[0] / 2);
          const minY = platform.position[1] - (platform.scale[1] / 2);
          const maxY = platform.position[1] + (platform.scale[1] / 2);
          const minZ = platform.position[2] - (platform.scale[2] / 2);
          const maxZ = platform.position[2] + (platform.scale[2] / 2);

          const isAbovePlatform = (nextX + marbleRadius > minX && nextX - marbleRadius < maxX) &&
            (nextZ + marbleRadius > minZ && nextZ - marbleRadius < maxZ);

          if (isAbovePlatform) {
            if (playerVelocity[1] < 0 && playerPosition[1] - marbleRadius >= maxY && nextY - marbleRadius < maxY) {
              nextY = maxY + marbleRadius; 
              playerVelocity[1] = 0;       
              isGrounded = true;
            }
          }
        }
      }
      
      // Jumping
      if (isGrounded && playerInputs.movement.keyJump) {
        playerVelocity[1] = 18.0; 
        isGrounded = false;
      }

      playerPosition = [nextX, nextY, nextZ];

      mainCamera.update(playerPosition, playerInputs);

      // Resizing logic
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(canvas.clientWidth * dpr);
      const h = Math.round(canvas.clientHeight * dpr);

      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        const newAspect = canvas.width / canvas.height;
        P = perspective(50 * Math.PI / 180, newAspect, 0.1, 100);
      }

      gl.viewport(0, 0, canvas.width, canvas.height);

      // Setup for drawing
      VP = multiply(P, mainCamera.viewMatrix);

      gl.clearColor(0.10, 0.10, 0.10, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(program);

      // Draw Platforms (wedges and cubes)
      for (const platform of levelPlatforms) {
        if (platform.shape === "cube") {
          gl.bindBuffer(gl.ARRAY_BUFFER, cubeVerticeBuffer);
          gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, cubeIndiceBuffer);
        } else if (platform.shape === "wedge") {
          gl.bindBuffer(gl.ARRAY_BUFFER, wedgeVerticeBuffer);
          gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, wedgeIndiceBuffer);
        }

        const platformMVP = multiply(VP, platform.getMatrix());
        gl.uniformMatrix4fv(uMVP, false, platformMVP);

        const indexCount = platform.shape === "cube" ? 36 : 24;
        gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);
      }

      // Draw the marble
      gl.bindBuffer(gl.ARRAY_BUFFER, marbleIndiceBuffer);
      gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, marbleFaceBuffer);

      const M = translation(playerPosition[0], playerPosition[1], playerPosition[2]);
      const mvp = multiply(VP, M);

      gl.uniformMatrix4fv(uMVP, false, mvp);
      gl.drawElements(gl.TRIANGLES, calculatedFaces.length, gl.UNSIGNED_SHORT, 0);

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>

</html>
